name: Test Project
on: push
# you can set up a trigger with different branches
# on:
#   push:
#     branches:
#       - 'develop'
#       - 'main'
#       - 'features/**'
jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Get Hash Git
        uses: actions/checkout@v7
      - name: Get Node Setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Testing App
        run: npm test